name: release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'release/VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release request and set firmware version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          ref_type = os.environ.get('GITHUB_REF_TYPE', '')
          ref_name = os.environ['GITHUB_REF_NAME']
          if ref_type == 'tag':
              tag = ref_name
              if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
                  raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH')
              version = tag[1:]
          else:
              version = open('release/VERSION', encoding='utf-8').read().strip()
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise SystemExit('release/VERSION must contain MAJOR.MINOR.PATCH')
              tag = 'v' + version

          with open('include/GeneratedVersion.h', 'w', encoding='utf-8') as f:
              f.write('#pragma once\n#define FRIEND_BOX_VERSION "' + version + '"\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('RELEASE_TAG=' + tag + '\n')
          PY
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Run host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ilib/FriendBoxCore/src \
            lib/FriendBoxCore/src/FriendBoxCore.cpp \
            lib/FriendBoxCore/src/MorseComposer.cpp \
            lib/FriendBoxCore/src/PresetCatalog.cpp tests/host/test_core.cpp \
            -o /tmp/friendbox-core-tests
          /tmp/friendbox-core-tests
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ilib/FriendBoxCore/src -Isrc/ui \
            lib/FriendBoxCore/src/MorseComposer.cpp src/ui/Ui.cpp tests/host/test_ui.cpp \
            -o /tmp/friendbox-ui-tests
          /tmp/friendbox-ui-tests
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            tests/host/test_service_config.cpp -o /tmp/friendbox-service-tests
          /tmp/friendbox-service-tests
          python3 tests/host/test_manifest.py
          python3 scripts/validate_project.py
          python3 scripts/validate_local_provisioning.py
      - name: Build firmware
        run: pio run -e friendbox
      - name: Generate OTA manifest
        run: |
          mkdir -p dist
          cp .pio/build/friendbox/firmware.bin dist/firmware.bin
          python3 scripts/generate_manifest.py \
            --firmware dist/firmware.bin \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output dist/manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/firmware.bin dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --generate-notes
